spring:
  application:
    name: gmo-payments-reference
  datasource:
    # Parameters are applied by the Xerial driver on every connection. WAL
    # improves reader/writer coexistence; busy_timeout absorbs short lock bursts;
    # foreign_keys prevents orphaned payment/event data.
    url: ${DATABASE_URL:jdbc:sqlite:runtime/gmo-payments.db?journal_mode=WAL&busy_timeout=5000&foreign_keys=on}
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: ${DATABASE_MAX_POOL_SIZE:4}
      minimum-idle: 1
      connection-timeout: 5000
      idle-timeout: 300000
      max-lifetime: 600000
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO
    io.github.patelsa032766.gmopayments: INFO
